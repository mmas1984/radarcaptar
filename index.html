<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radar Capta — Rastreador de Editais Públicos no Brasil</title>
    <meta
      name="description"
      content="Rastreador e analista de editais públicos vigentes e captação de recursos para municípios, estados e consórcios no Brasil."
    />
    <meta property="og:title" content="Radar Capta — Rastreador de Editais Públicos no Brasil" />
    <meta
      property="og:description"
      content="Rastreador e analista de editais públicos vigentes e captação de recursos para municípios, estados e consórcios no Brasil."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-[#0F5132]/15 selection:text-[#0F5132]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if (
        window.location.hostname.endsWith('.github.io') &&
        document.querySelector('script[src="/src/main.tsx"]')
      ) {
        var root = document.getElementById('root');
        if (root) {
          var wrap = document.createElement('div');
          wrap.style.cssText =
            'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#F8FAFC;font-family:"Public Sans",system-ui,sans-serif;color:#0F172A;';
          var card = document.createElement('div');
          card.style.cssText =
            'max-width:520px;width:100%;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;padding:28px;line-height:1.6;';
          var h1 = document.createElement('h1');
          h1.style.cssText = 'margin:0 0 12px;font-size:20px;font-weight:700;color:#0F172A;';
          h1.textContent = 'Radar Capta — Publicação pendente no GitHub Pages';
          var p1 = document.createElement('p');
          p1.style.cssText = 'margin:0 0 12px;font-size:14px;color:#475569;';
          p1.textContent =
            'O GitHub Pages está servindo o código-fonte bruto (index.html com TypeScript) em vez da versão compilada.';
          var p2 = document.createElement('p');
          p2.style.cssText = 'margin:0;font-size:14px;color:#0F172A;font-weight:500;';
          p2.textContent =
            'Para colocar o site no ar: no repositório do GitHub, abra Settings > Pages > Build and deployment > Source e selecione "GitHub Actions". Depois execute o workflow "Deploy to GitHub Pages" na aba Actions.';
          card.appendChild(h1);
          card.appendChild(p1);
          card.appendChild(p2);
          wrap.appendChild(card);
          root.appendChild(wrap);
        }
      }
    </script>
  </body>
</html>
